# Required repository secrets for the Android (Meta Quest) job:
#   ANDROID_KEYSTORE_BASE64   - release.keystore encoded as base64 (base64 -w 0 release.keystore)
#   ANDROID_KEY_ALIAS         - key alias chosen when the keystore was created
#   ANDROID_KEYSTORE_PASSWORD - password for both the keystore and the key
# If these secrets are absent the Android job will fail; Windows and Linux builds are unaffected.
# IMPORTANT: keep the original release.keystore file safe - losing it prevents updating existing installs.
#
# Optional repository secret for the sidequest-release job:
#   SIDEQUEST_WEBHOOK_TOKEN - the BIG_LONG_TOKEN at the end of the webhook URL from SideQuest App Studio
#                             (App Studio -> app -> Distribution -> "Copy webhook URL"). If absent the job is skipped.
#   Use this instead of the GitHub "release" webhook on the repo, which can fire before the APK is attached.
#
# Required repository secret for the itch-release job:
#   BUTLER_API_KEY - itch.io API key with permission to push builds, from
#                    https://itch.io/user/settings/api-keys
# If this secret is absent the itch-release job will fail; the GitHub Release is unaffected.
# This job pushes to https://benmclean.itch.io/wolfsharp using itch.io's "butler" CLI, one
# channel per platform (windows-x64, linux-x64, linux-arm64, android-meta-quest). It only runs
# on tag pushes, same as the GitHub Release job, and only after all builds succeed.
#
# Both Linux jobs (linux-x64, linux-arm64 - the latter for Steam Frame) wrap their export into a
# portable .AppImage (no extra secrets needed). It's built with appimagetool alone, not
# linuxdeploy, so it does NOT bundle system shared libraries (Vulkan/Mesa/GL, libc, X11/Wayland,
# audio) - deliberately, since bundling GPU driver libraries would break hardware acceleration on
# the host. This assumes those libraries are present on the target system, which holds for
# SteamOS and any current mainstream distro. appimagetool always runs as the native x86_64
# build; for linux-arm64 it is handed the aarch64 type2 runtime via --runtime-file, so no arm64
# code needs to execute on the x86_64 GitHub-hosted runner (no QEMU).
#
# HOW TO CUT A RELEASE:
#   Push (or create, in the GitHub web UI under Releases -> Tags) a tag whose name starts with a
#   lowercase "v", e.g. "v0.1.0". Everything after the "v" becomes the release version number, so
#   the tag "v0.1.0" produces version "0.1.0" and a release named "v0.1.0".
#     git tag v0.1.0
#     git push origin v0.1.0
#   That push triggers this workflow automatically: it builds Windows, Linux (x64 and arm64), and
#   Android, then the "release" job downloads all build artifacts, creates a GitHub Release for
#   that tag, and attaches the build files.
#   Nothing further is needed - the Release goes up as soon as every build finishes. To add
#   hand-written release notes afterward, edit the published release in the GitHub web UI.
#
# HOW TO GET A PREVIEW BUILD (no release, no tag):
#   1. In the GitHub web UI, go to Actions -> "Build" (this workflow) in the left sidebar.
#   2. Click "Run workflow" (top right of the runs list).
#   3. Pick the branch to build from, enter a throwaway version string (e.g. "0.0.0-preview" or a
#      date/commit stamp) in the "Version number" field, and click the green "Run workflow" button.
#   4. Wait for the "Export <platform>" jobs and "Export Android (Meta Quest)" to finish (green
#      checks). Windows and Android each produce one file: BenMcLean.Wolf3D.VR_windows-x64_v<version>.zip,
#      ..._android-meta-quest_v<version>.apk. Linux produces folders instead of single files:
#      itch-linux-x64 / itch-linux-arm64 (AppImage + games/ + README; run chmod +x on the
#      AppImage after downloading) and linux-release-linux-* (AppImage, .zsync, .deb, .rpm).
#   5. Open the completed run's summary page and download each artifact under "Artifacts".
#      GitHub Actions artifacts are zipped again on download, so unzip once to get the real file.
#   Manually running the workflow this way never creates a GitHub Release (that only happens from
#   a "v*" tag push, per the "release" job's `if:` condition) - it's just the build outputs to
#   download and test locally. Old preview artifacts expire automatically (GitHub's default
#   artifact retention period) and never need cleanup.
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.7.2"

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  export:
    name: Export ${{ matrix.name }}
    needs: determine-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - preset: "Windows Desktop"
            name: windows-x64
            output_dir: build/windows
            release_dir: build/windows
            output_file: BenMcLean.Wolf3D.VR.exe
          - preset: "Linux"
            name: linux-x64
            output_dir: build/linux
            release_dir: build/linux-release
            output_file: BenMcLean.Wolf3D.VR.x86_64
            appimage_arch: x86_64
            nfpm_arch: amd64
          - preset: "Linux (arm64)"
            name: linux-arm64
            output_dir: build/linux-arm64
            release_dir: build/linux-arm64-release
            output_file: BenMcLean.Wolf3D.VR.arm64
            appimage_arch: aarch64
            nfpm_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux.x86_64" /usr/local/bin/godot
          sudo cp -r "Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64/GodotSharp" /usr/local/bin/GodotSharp

      - name: Install export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono"
          unzip -q templates.tpz -d /tmp/godot_tpl
          mv /tmp/godot_tpl/templates/* "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono/"

      - name: Import project resources
        working-directory: godot/BenMcLean.Wolf3D.VR
        run: godot --headless --import

      - name: Build C# assemblies
        working-directory: godot/BenMcLean.Wolf3D.VR
        run: dotnet build

      - name: Export "${{ matrix.preset }}"
        working-directory: godot/BenMcLean.Wolf3D.VR
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ matrix.output_dir }}"
          godot --headless --export-release "${{ matrix.preset }}" "$GITHUB_WORKSPACE/${{ matrix.output_dir }}/${{ matrix.output_file }}"

      - name: Bundle games folder and README (Windows only)
        if: matrix.name == 'windows-x64'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ matrix.output_dir }}/games"
          cp "$GITHUB_WORKSPACE/games/GAMES.md" "$GITHUB_WORKSPACE/${{ matrix.output_dir }}/games/GAMES.md"
          if [ -f "$GITHUB_WORKSPACE/README.md" ]; then
            cp "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/${{ matrix.output_dir }}/README.md"
          fi

      - name: Assemble AppDir
        if: startsWith(matrix.name, 'linux-')
        env:
          OUTPUT_FILE: ${{ matrix.output_file }}
        run: |
          APPDIR="$GITHUB_WORKSPACE/build/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$GITHUB_WORKSPACE/${{ matrix.output_dir }}/." "$APPDIR/usr/bin/"
          cat > "$APPDIR/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$OUTPUT_FILE" "\$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cp "$GITHUB_WORKSPACE/promo/icon/icon256.png" "$APPDIR/net.benmclean.wolf3d.png"
          sed 's/^Exec=.*/Exec=AppRun/' "$GITHUB_WORKSPACE/packaging/linux/net.benmclean.wolf3d.desktop" > "$APPDIR/net.benmclean.wolf3d.desktop"

      - name: Build AppImage
        if: startsWith(matrix.name, 'linux-')
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          wget -q "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.appimage_arch }}" -O runtime
          chmod +x appimagetool
          sudo apt-get install -y -qq zsync
          mkdir -p "$GITHUB_WORKSPACE/${{ matrix.release_dir }}/games"
          # --appimage-extract-and-run avoids needing FUSE, which isn't available on GH-hosted runners
          # appimagetool spells aarch64 as "arm_aarch64" for its ARCH variable (plain "aarch64" is rejected)
          TOOL_ARCH="${{ matrix.appimage_arch }}"
          if [ "$TOOL_ARCH" = "aarch64" ]; then TOOL_ARCH=arm_aarch64; fi
          # -u embeds update info (read by AppImageUpdate, Gear Lever, etc.) and makes appimagetool
          # write a .zsync file next to where it is run, for delta updates from the latest GitHub Release
          APPIMAGE_NAME="BenMcLean.Wolf3D.VR-${{ matrix.appimage_arch }}.AppImage"
          mkdir -p "$GITHUB_WORKSPACE/appimage-update"
          cd "$GITHUB_WORKSPACE/appimage-update"
          ARCH="$TOOL_ARCH" "$GITHUB_WORKSPACE/appimagetool" --appimage-extract-and-run --runtime-file "$GITHUB_WORKSPACE/runtime" \
            -u "gh-releases-zsync|BenMcLean|WolfSharp|latest|$APPIMAGE_NAME.zsync" \
            "$GITHUB_WORKSPACE/build/AppDir" \
            "$GITHUB_WORKSPACE/${{ matrix.release_dir }}/$APPIMAGE_NAME"
          # Standalone copy of the AppImage beside its .zsync, uploaded as its own release asset below
          cp "$GITHUB_WORKSPACE/${{ matrix.release_dir }}/$APPIMAGE_NAME" .
          cd "$GITHUB_WORKSPACE"
          cp "$GITHUB_WORKSPACE/games/GAMES.md" "$GITHUB_WORKSPACE/${{ matrix.release_dir }}/games/GAMES.md"
          if [ -f "$GITHUB_WORKSPACE/README.md" ]; then
            cp "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/${{ matrix.release_dir }}/README.md"
          fi

      - name: Build .deb and .rpm
        if: startsWith(matrix.name, 'linux-')
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          VERSION: ${{ needs.determine-version.outputs.version }}
          EXPORT_DIR: ${{ matrix.output_dir }}
        run: |
          wget -q "https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_Linux_x86_64.tar.gz" -O nfpm.tar.gz
          tar -xzf nfpm.tar.gz nfpm
          # nfpm doesn't expand env vars in contents.src, so substitute them ourselves
          envsubst '${NFPM_ARCH} ${VERSION} ${EXPORT_DIR}' < packaging/linux/nfpm.yaml > nfpm-resolved.yaml
          for fmt in deb rpm; do
            ./nfpm package --config nfpm-resolved.yaml --packager "$fmt" --target appimage-update/
          done

      - name: Package release archive (Windows)
        if: matrix.name == 'windows-x64'
        env:
          ARCHIVE_NAME: BenMcLean.Wolf3D.VR_${{ matrix.name }}_v${{ needs.determine-version.outputs.version }}
        run: |
          cd "$GITHUB_WORKSPACE/${{ matrix.release_dir }}"
          zip -qr "$GITHUB_WORKSPACE/$ARCHIVE_NAME.zip" .

      - name: Upload Windows build
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: BenMcLean.Wolf3D.VR_${{ matrix.name }}_v${{ needs.determine-version.outputs.version }}
          path: BenMcLean.Wolf3D.VR_${{ matrix.name }}_v${{ needs.determine-version.outputs.version }}.zip

      # Linux: the release dir (AppImage + games/ + README) is pushed to itch.io as a plain folder.
      # Artifact upload drops the executable bit; the itch-release job restores it.
      - name: Upload Linux folder (for itch.io)
        if: startsWith(matrix.name, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: itch-${{ matrix.name }}
          path: ${{ matrix.release_dir }}/

      # Linux GitHub Release assets: standalone AppImage + .zsync (for AppImageUpdate), .deb, .rpm
      - name: Upload Linux release assets
        if: startsWith(matrix.name, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ matrix.name }}
          path: appimage-update/*

  export-android:
    name: Export Android (Meta Quest)
    needs: determine-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.14206865" \
            "build-tools;36.1.0" \
            "platforms;android-36"

      - name: Download Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux.x86_64" /usr/local/bin/godot
          sudo cp -r "Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64/GodotSharp" /usr/local/bin/GodotSharp

      - name: Install export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono"
          unzip -q templates.tpz -d /tmp/godot_tpl
          mv /tmp/godot_tpl/templates/* "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono/"

      - name: Import project resources
        working-directory: godot/BenMcLean.Wolf3D.VR
        run: godot --headless --import

      - name: Build C# assemblies
        working-directory: godot/BenMcLean.Wolf3D.VR
        run: dotnet build

      - name: Download OpenXR Vendors plugin
        working-directory: godot/BenMcLean.Wolf3D.VR
        run: bash setup-openxr-vendors.sh

      - name: Install Android build template
        working-directory: godot/BenMcLean.Wolf3D.VR
        run: |
          mkdir -p android/build
          unzip -q "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable.mono/android_source.zip" -d android/build
          echo "${{ env.GODOT_VERSION }}.stable.mono" > android/.build_version

      - name: Set Android version
        # version/code becomes android:versionCode, which Android requires to be a
        # monotonically increasing integer - github.run_number fits since it only ever
        # goes up, unlike the human-readable version string (which isn't a plain integer).
        working-directory: godot/BenMcLean.Wolf3D.VR
        run: |
          sed -i "s|^version/code=.*|version/code=${{ github.run_number }}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${{ needs.determine-version.outputs.version }}\"|" export_presets.cfg

      - name: Write keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Configure export credentials
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat > "godot/BenMcLean.Wolf3D.VR/.godot/export_credentials.cfg" <<EOF
          [preset.0]

          script_encryption_key=""

          [preset.0.options]

          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release="$GITHUB_WORKSPACE/release.keystore"
          keystore/release_user="$KEY_ALIAS"
          keystore/release_password="$KEYSTORE_PASSWORD"

          [preset.1]

          script_encryption_key=""

          [preset.1.options]

          codesign/identity_type=0
          codesign/identity=""
          codesign/password=""
          EOF

      - name: Export Android
        working-directory: godot/BenMcLean.Wolf3D.VR
        env:
          APK_NAME: BenMcLean.Wolf3D.VR_android-meta-quest_v${{ needs.determine-version.outputs.version }}.apk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/android"
          godot --headless --export-release "Android" "$GITHUB_WORKSPACE/build/android/$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: BenMcLean.Wolf3D.VR_android-meta-quest_v${{ needs.determine-version.outputs.version }}
          path: build/android/BenMcLean.Wolf3D.VR_android-meta-quest_v${{ needs.determine-version.outputs.version }}.apk

  # Fail fast across jobs: GitHub only cancels siblings within one matrix, so if either the export
  # matrix or the Android job fails, these cancel the whole run rather than burning minutes on
  # builds that can no longer be released.
  cancel-on-export-failure:
    name: Cancel run on export failure
    needs: export
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  cancel-on-android-failure:
    name: Cancel run on Android failure
    needs: export-android
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    name: Create Release
    needs: [determine-version, export, export-android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # itch-* artifacts are the folders pushed to itch.io; they duplicate the Linux release assets.
      - name: Keep itch.io folders off the Release
        run: rm -rf artifacts/itch-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*/*

  sidequest-release:
    name: Update SideQuest
    needs: [determine-version, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SIDEQUEST_WEBHOOK_TOKEN: ${{ secrets.SIDEQUEST_WEBHOOK_TOKEN }}
    steps:
      # Runs only after the GitHub Release (with the APK attached) exists. SideQuest's listing tracks the
      # latest GitHub release, so we replay the release event that GitHub's own webhook would send. The
      # version-webhook endpoint returns 410 for listings whose files are managed by GitHub.
      - name: Notify SideQuest
        run: |
          if [ -z "$SIDEQUEST_WEBHOOK_TOKEN" ]; then
            echo "SIDEQUEST_WEBHOOK_TOKEN not set; skipping SideQuest update"
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            "https://sdq.st/release-webhook/$SIDEQUEST_WEBHOOK_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: release' \
            -d "{\"action\": \"published\", \"repository\": {\"full_name\": \"${{ github.repository }}\", \"name\": \"${{ github.event.repository.name }}\", \"owner\": {\"login\": \"${{ github.repository_owner }}\"}}, \"release\": {\"tag_name\": \"${{ github.ref_name }}\"}}"

  itch-release:
    name: Push to itch.io
    needs: [determine-version, export, export-android, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: benmclean/wolfsharp
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V

      - name: Push Windows build
        run: |
          mkdir -p push/windows-x64
          unzip -q "artifacts/BenMcLean.Wolf3D.VR_windows-x64_v${VERSION}/BenMcLean.Wolf3D.VR_windows-x64_v${VERSION}.zip" -d push/windows-x64
          ./butler/butler push push/windows-x64 "$ITCH_TARGET:windows-x64" --userversion "$VERSION"

      - name: Push Linux build
        run: |
          chmod +x artifacts/itch-linux-x64/*.AppImage
          ./butler/butler push artifacts/itch-linux-x64 "$ITCH_TARGET:linux-x64" --userversion "$VERSION"

      - name: Push Linux arm64 build (Steam Frame)
        run: |
          chmod +x artifacts/itch-linux-arm64/*.AppImage
          ./butler/butler push artifacts/itch-linux-arm64 "$ITCH_TARGET:linux-arm64" --userversion "$VERSION"

      - name: Push Android build
        run: |
          ./butler/butler push "artifacts/BenMcLean.Wolf3D.VR_android-meta-quest_v${VERSION}/BenMcLean.Wolf3D.VR_android-meta-quest_v${VERSION}.apk" "$ITCH_TARGET:android-meta-quest" --userversion "$VERSION"
